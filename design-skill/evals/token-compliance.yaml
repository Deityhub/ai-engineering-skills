name: token-compliance
description: "Validate source files use design tokens instead of magic numbers"
category: token-validation
priority: high

input:
  paths:
    - "src/components"
    - "src/pages"
    - "styles"
  token_file: "references/token-reference.md"
  auto_fix: true
  dry_run: true

expected_violations:
  spacing:
    - pattern: "\\b(4|8|12|16|20|24|32|40|48|64)\\s*px"
      replacement_map:
        "4px": "var(--space-1)"
        "8px": "var(--space-2)"
        "12px": "var(--space-3)"
        "16px": "var(--space-4)"
        "20px": "var(--space-5)"
        "24px": "var(--space-6)"
        "32px": "var(--space-8)"
        "40px": "var(--space-10)"
        "48px": "var(--space-12)"
        "64px": "var(--space-16)"
  color:
    - pattern: "#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\\b"
      known_tokens:
        "#2563eb": "var(--color-primary)"
        "#1d4ed8": "var(--color-primary-hover)"
        "#1e40af": "var(--color-primary-active)"
        "#93c5fd": "var(--color-primary-disabled)"
        "#3b82f6": "var(--color-primary)"  # dark mode
        "#60a5fa": "var(--color-primary-hover)"  # dark mode
        "#ef4444": "var(--color-error)"
        "#22c55e": "var(--color-success)"
        "#f59e0b": "var(--color-warning)"
  typography:
    - pattern: "font-size:\\s*(12|14|16|18|20|24|30|36|48|60)\\s*px"
      replacement_map:
        "12px": "var(--text-xs)"
        "14px": "var(--text-sm)"
        "16px": "var(--text-base)"
        "18px": "var(--text-lg)"
        "20px": "var(--text-xl)"
        "24px": "var(--text-2xl)"
        "30px": "var(--text-3xl)"
        "36px": "var(--text-4xl)"
        "48px": "var(--text-5xl)"
        "60px": "var(--text-6xl)"
  border_radius:
    - pattern: "border-radius:\\s*(4|8|12|16|24|9999)\\s*px"
      replacement_map:
        "4px": "var(--radius-sm)"
        "8px": "var(--radius-md)"
        "12px": "var(--radius-lg)"
        "16px": "var(--radius-xl)"
        "24px": "var(--radius-2xl)"
        "9999px": "var(--radius-full)"
  shadow:
    - pattern: "box-shadow:\\s*[^;]+"
      replacement_map:
        "0 1px 2px 0 rgb(0 0 0 / 0.05)": "var(--shadow-sm)"
        "0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)": "var(--shadow-md)"
        "0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)": "var(--shadow-lg)"
        "0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)": "var(--shadow-xl)"

success_criteria:
  - magic_numbers_found: 0
  - auto_fix_applicable: true
  - all_files_pass: true